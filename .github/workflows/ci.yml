name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The pnpm version is single-sourced from package.json "packageManager".
      # Do NOT add a `version:` input here: pnpm/action-setup aborts when it
      # conflicts with "packageManager" (ERR: "Multiple versions of pnpm specified"),
      # which is exactly what broke the removed Pages deploy job.
      - name: Install pnpm
        uses: pnpm/action-setup@v3

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
