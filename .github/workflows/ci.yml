name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The pnpm version is single-sourced from package.json "packageManager".
      # Do NOT add a `version:` input here: pnpm/action-setup aborts when it
      # conflicts with "packageManager" (ERR: "Multiple versions of pnpm specified"),
      # which is exactly what broke the removed Pages deploy job.
      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0

      - name: Use Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ff24fc8ce4e532605380 # v4.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
